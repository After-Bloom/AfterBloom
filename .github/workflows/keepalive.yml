# Free Supabase projects pause after about a week of inactivity. This pings the app (which queries the database) every 3 days.
name: keep-alive
on:
  schedule: [{ cron: "17 4 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app and database
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "${{ secrets.APP_URL }}/api/health"
